name: Run All Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Set up Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        install-dependencies: true

    - name: Run all tests
      run: mvn test
      working-directory: ./mavenproject1

    - name: Generate HTML test report
      if: always()
      run: mvn surefire-report:report-only site:site -DgenerateReports=false
      working-directory: ./mavenproject1

    - name: Upload HTML test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: all-tests-report
        path: mavenproject1/target/site

    - name: Upload Surefire XML results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: mavenproject1/target/surefire-reports
